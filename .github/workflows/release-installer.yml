name: Publish installer release

# Se activa cuando se sube una etiqueta de versión vX.Y.Z
on:
  push:
    tags:
      - 'v*.*.*'
  # También puede activarse manualmente desde la pestaña Acciones
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Cada plataforma se compila por su cuenta y un último job publica todas
# juntas. Así una sola etiqueta produce una única Release con el .exe, el
# AppImage y los dos .dmg, en vez de publicaciones separadas que se pisarían.
jobs:

  # ---------------------------------------------------------------------
  # Windows: instalador de Inno Setup
  # ---------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonado del repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configuración del SDK de .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Descargar apktool.jar
        shell: pwsh
        run: |
          # Buscar la última versión de Apktool y descargar el .jar
          $api = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"
          $headers = @{ "User-Agent" = "letradelta-installer-build" }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $jarAsset = $release.assets | Where-Object { $_.name -like "apktool_*.jar" } | Select-Object -First 1
          if (-not $jarAsset) {
            throw "No se encontró apktool_*.jar en la última release de Apktool"
          }
          Write-Host "Descargando $($jarAsset.name)..."
          Invoke-WebRequest -Uri $jarAsset.browser_download_url -OutFile "DeltaPatcherCLI/DeltaPatcher/apktool.jar"

      - name: Compilar DeltaPatcherCLI (versión de lanzamiento, win-x64, archivo único)
        shell: pwsh
        working-directory: DeltaPatcherCLI/DeltaPatcher
        run: |
          dotnet publish DeltaPatcherCLI.csproj `
            -c Release `
            -r win-x64 `
            --output publish `
            -m:1
          if (-not (Test-Path "publish/DeltaPatcherCLI.exe")) {
            throw "DeltaPatcherCLI.exe no se generó"
          }

      - name: Empaquetar DeltaPatcherCLI.exe en DeltaPatcherCLI.7z
        shell: pwsh
        run: |
          # 7zip viene preinstalado en windows-latest; usamos la ruta completa
          # y caemos a PATH solo si no se encuentra en el lugar habitual.
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = "7z"  # confiar en PATH
          }

          # Comprimir desde dentro de publish/ para que el .exe quede en la raíz
          # del .7z sin subcarpetas. El instalador espera exactamente esa estructura.
          Push-Location "DeltaPatcherCLI/DeltaPatcher/publish"
          & $sevenZip a -t7z -mx=9 "${{ github.workspace }}\DeltaPatcherCLI.7z" DeltaPatcherCLI.exe
          Pop-Location

          if ($LASTEXITCODE -ne 0) {
            throw "7z falló al crear DeltaPatcherCLI.7z (código $LASTEXITCODE)"
          }
          if (-not (Test-Path "DeltaPatcherCLI.7z")) {
            throw "DeltaPatcherCLI.7z no se generó"
          }

      - name: Asegurar Inno Setup 6
        shell: pwsh
        run: |
          # La ruta lleva dentro el número de versión mayor, así que hay que
          # fijar también la versión que instala Chocolatey. Sin fijarla, el
          # día que la última publicada sea la 7 se instalaría en otra
          # carpeta y este paso fallaría diciendo que no se instaló, cuando
          # en realidad sí se instaló pero en otro sitio. La 7 tampoco está
          # probada con este script: quedan avisos de obsolescencia (el
          # identificador `x64`, `Extract7ZipArchive`) que un salto de
          # versión mayor puede haber convertido en errores.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe no encontrado, instalando vía choco..."
            choco install innosetup -y --no-progress --version=6.7.1 --allow-downgrade
            if (-not (Test-Path $iscc)) {
              throw "Inno Setup 6 no quedó instalado en $iscc"
            }
          }
          Write-Host "Inno Setup listo en $iscc"
          # Se comparte con el paso de compilación para no repetir la ruta.
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar el instalador (setup.iss)
        shell: pwsh
        run: |
          & "$env:ISCC" setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC falló con código $LASTEXITCODE"
          }
          # Por defecto Inno Setup deja el .exe en .\Output\
          if (-not (Test-Path "Output/InstaladorLetraDelta.exe")) {
            throw "El instalador no se generó en Output/InstaladorLetraDelta.exe"
          }

      - name: Subir el .exe como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: Output/InstaladorLetraDelta.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Linux: AppImage con el asistente gráfico y el parcheador dentro
  # ---------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Clonado del repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Comprobar que las versiones coinciden
        # El comentario del .csproj dice que se mantiene alineado con AppVersion,
        # pero nada lo comprobaba y se desalinearon igualmente (1.1.0 frente a
        # 1.2.0), sin que se notara en dos releases. Al etiquetar se comprueba
        # además que la etiqueta coincida: publicar una v1.3.0 que por dentro
        # dice otra cosa es peor que no publicar nada.
        run: |
          iss=$(grep -oP '^AppVersion=\K.*' setup.iss)
          csproj=$(grep -oP '<Version>\K[^<]+' gui/InstaladorLetraDelta.csproj)
          echo "setup.iss=$iss  csproj=$csproj  ref=$GITHUB_REF_NAME"

          if [ "$iss" != "$csproj" ]; then
            echo "::error::AppVersion ($iss) y <Version> ($csproj) no coinciden"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$iss" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $iss"
            exit 1
          fi

      - name: Configuración del SDK de .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Dependencias del empaquetado
        # ImageMagick convierte icon.ico al PNG que pide la especificación de
        # iconos; desktop-file-utils lo usa appimagetool para validar el
        # .desktop antes de empaquetar.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick desktop-file-utils

      - name: Construir el AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Comprobar que el AppImage arranca
        # Sin escritorio no se puede abrir la ventana, pero sí verificar que el
        # runtime monta el AppDir y que los binarios que viajan dentro responden.
        run: |
          ./Output/InstaladorLetraDelta-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/InstaladorLetraDelta
          test -x squashfs-root/usr/bin/DeltaPatcherCLI
          test -x squashfs-root/usr/bin/7zzs
          ./squashfs-root/usr/bin/DeltaPatcherCLI | head -5
          ./squashfs-root/usr/bin/7zzs | head -2
          rm -rf squashfs-root

      - name: Subir el AppImage como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: instalador-linux
          path: Output/InstaladorLetraDelta-x86_64.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # macOS: un .dmg por arquitectura
  # ---------------------------------------------------------------------
  # Se compilan las dos por separado porque .NET no produce un binario
  # universal: cada runner compila de forma nativa la suya. `macos-latest` es
  # Apple Silicon y `macos-15-intel` es el último runner de Intel que queda.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clonado del repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configuración del SDK de .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Construir el paquete y el DMG
        run: bash packaging/macos/build-app.sh ${{ matrix.rid }}

      - name: Comprobar que el paquete arranca
        # Sin escritorio no se puede abrir la ventana, pero sí verificar que la
        # firma ad hoc es válida (sin ella el binario no se ejecutaría en Apple
        # Silicon) y que los binarios que viajan dentro responden.
        run: |
          codesign --verify --deep --strict --verbose=2 build/InstaladorLetraDelta.app
          ./build/InstaladorLetraDelta.app/Contents/MacOS/DeltaPatcherCLI | head -5
          ./build/InstaladorLetraDelta.app/Contents/MacOS/7zz | head -2

      - name: Diagnóstico de la firma (solo si algo falló)
        # La firma en macOS solo se puede probar en un Mac, así que cuando falla
        # conviene volver con datos en vez de con otra suposición: qué firma
        # tiene el paquete, qué opina Gatekeeper y qué hay dentro.
        if: failure()
        run: |
          echo "--- codesign -dvvv del paquete ---"
          codesign -dvvv build/InstaladorLetraDelta.app 2>&1 || true
          echo "--- evaluación de Gatekeeper ---"
          spctl --assess --type execute --verbose=4 build/InstaladorLetraDelta.app 2>&1 || true
          echo "--- contenido de Contents/MacOS (recuento por tipo) ---"
          find build/InstaladorLetraDelta.app/Contents/MacOS -type f | wc -l
          find build/InstaladorLetraDelta.app/Contents/MacOS -name '*.dll' | wc -l
          echo "--- estructura ---"
          ls -la build/InstaladorLetraDelta.app/Contents
          ls build/InstaladorLetraDelta.app/Contents/_CodeSignature 2>&1 || true

      - name: Subir el DMG como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: instalador-macos-${{ matrix.arch }}
          path: Output/InstaladorLetraDelta-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publicación conjunta (solo al etiquetar)
  # ---------------------------------------------------------------------
  publish:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION_TAG: ${{ github.ref_name }}

    steps:
      - name: Clonado del repositorio
        uses: actions/checkout@v7

      - name: Descargar los artefactos de ambas plataformas
        # Se queda en la v4 a propósito, aunque hay v8. Este job solo se ejecuta
        # al etiquetar, así que un `workflow_dispatch` no lo prueba: subirla
        # sería un cambio que no se puede verificar hasta el próximo release, y
        # justo esta acción cambió la estructura de carpetas entre versiones
        # mayores, que es de lo que depende el paso siguiente.
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Reunir y renombrar los archivos
        # Los nombres llevan plataforma y versión porque es lo que se ve en la
        # carpeta de Descargas meses después, y lo primero que hay que preguntar
        # al dar soporte. "InstaladorLetraDelta.exe" a secas no dice ninguna
        # de las dos cosas.
        run: |
          version="${VERSION_TAG#v}"
          mkdir -p Output

          mv artefactos/instalador-windows/InstaladorLetraDelta.exe \
             "Output/InstaladorLetraDelta-$version-Windows.exe"
          mv artefactos/instalador-linux/InstaladorLetraDelta-x86_64.AppImage \
             "Output/InstaladorLetraDelta-$version-Linux-x86_64.AppImage"
          mv artefactos/instalador-macos-arm64/InstaladorLetraDelta-arm64.dmg \
             "Output/InstaladorLetraDelta-$version-macOS-arm64.dmg"
          mv artefactos/instalador-macos-x64/InstaladorLetraDelta-x64.dmg \
             "Output/InstaladorLetraDelta-$version-macOS-Intel.dmg"

          ls -la Output

      - name: Preparar las notas de la versión
        id: notas
        run: |
          version="${VERSION_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md changelog.md
          else
            echo "Versión $VERSION_TAG del instalador de LetraDelta." > changelog.md
          fi

      - name: Publicar la versión etiquetada (vX.Y.Z)
        run: |
          gh release create "$VERSION_TAG" \
            --title "Versión ${{ steps.notas.outputs.version }}" \
            --notes-file changelog.md \
            --latest \
            Output/*
